# Netlify-Konfiguration für den PROVIBE-Shop.
# Alles Infrastrukturelle steht hier im Repo (ADR-005). Secrets kommen ausschließlich
# aus Netlify-Umgebungsvariablen, nie aus dieser Datei.

[build]
  command = "pnpm build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "22"
  PNPM_FLAGS = "--frozen-lockfile"
  NEXT_TELEMETRY_DISABLED = "1"

[[plugins]]
  package = "@netlify/plugin-nextjs"

# Deploy Previews und Branch-Deploys bekommen keine Live-Secrets. Sie laufen komplett
# gegen die Mock-Provider (APP_INTEGRATIONS=mock). Live-Keys sind in Netlify nur für den
# Kontext "production" gesetzt (Scope pro Kontext beim Anlegen der Variablen wählen).
[context.deploy-preview.environment]
  APP_INTEGRATIONS = "mock"
  APP_STAGE = "preview"

[context.branch-deploy.environment]
  APP_INTEGRATIONS = "mock"
  APP_STAGE = "preview"

[context.production.environment]
  APP_STAGE = "production"

# Bis zum Go-live: kein Crawler indexiert die Netlify-Domain. Der Header fällt
# im Zuge des DNS-Umzugs (docs/golive.md).
[[headers]]
  for = "/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow, noarchive"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains; preload"
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=(self)"
    Cross-Origin-Opener-Policy = "same-origin"

[[headers]]
  for = "/admin/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow, noarchive"
    Cache-Control = "no-store"

